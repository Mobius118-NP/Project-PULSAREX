name: Synthetic tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[packaging,discovery]"
      - run: python -m PyInstaller --noconfirm PULSAREX.spec
      - run: python examples/smoke_executable.py dist/PULSAREX/PULSAREX.exe package-smoke
      - name: Verify frozen launcher backend
        shell: pwsh
        run: |
          $launcherCheck = Start-Process -FilePath dist/PULSAREX/PULSAREX.exe -ArgumentList '--check-launcher', 'package-launcher-check.json' -WindowStyle Hidden -Wait -PassThru
          if ($launcherCheck.ExitCode -ne 0) { throw 'Packaged launcher check failed' }
          $launcherResult = Get-Content package-launcher-check.json | ConvertFrom-Json
          if (-not $launcherResult.passed) { throw 'Packaged launcher check did not pass' }
      - uses: actions/upload-artifact@v4
        with:
          name: PULSAREX-Windows
          path: dist/PULSAREX/
