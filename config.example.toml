# Copy to config.toml. PINs belong in PULSAR_PIN, never in this file.
sample_rate = 48000
fft_size = 4096
hop_size = 1024
channels = 1
source = "simulation"
# device = 0  # Run pulsar --list-devices to find input IDs.
min_frequency = 30.0
max_frequency = 18000.0
display_bins = 384
update_hz = 12.0
reference_hz = 1000.0
shift_range_hz = 200.0
zero_tolerance_hz = 2.0
calibration_seconds = 5.0
event_threshold_db = 12.0
event_cooldown_seconds = 3.0
harmonics_enabled = true
baseline_adaptation = false
# Initialization learns representative background; no noise cancellation is applied.
auto_calibrate = true
adaptation_seconds = 300.0
sensitivity = 4.0
band_edges = [250.0, 4000.0]
sensor_id = "local-acoustic-01"
characterization_enabled = false
argos_enabled = false
# Requires optional [discovery] dependency and an authenticated LAN binding.
mdns_enabled = false
# Only enable after verifying two distinct channels from one shared-clock device.
stereo_synchronized = false
stereo_spacing_m = 0.1
# Clockwise from diagram north, from microphone channel 0 toward channel 1.
stereo_axis_deg = 90.0
host = "127.0.0.1"
port = 8765
data_dir = "data"
# Two-mic example: channels=2, stereo_synchronized=true, measured spacing/axis above.
# Optional geometry overrides two-mic spacing/axis; order must match input channels.
# mic_positions = [[0.0, 0.0], [0.1, 0.0]]
# For >=3 microphones provide measured non-collinear planar geometry.
# mic_positions = [[0.0, 0.0], [0.04, 0.0], [0.0, 0.04]]

